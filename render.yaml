# Blueprint: deploy FastAPI from this monorepo (Vue frontend is usually on Vercel, etc.).
# Without rootDir, Render runs build at repo root — there is no requirements.txt there → exit 1.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: askpatio-ai
    runtime: python
    plan: free
    rootDir: fastapi
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
