# Render Blueprint (repo root). Sync in Dashboard or connect this repo to apply.
#
# Frontend static site (loomihomepatios.ca MUST attach here, NOT on askpatio-ai):
#   Root Directory:        .     (repo root — same folder as package.json)
#   Build Command:         npm install && npm run build
#   Publish Directory:     dist
#   Static files:          /sitemap.xml, /robots.txt, /llms.txt, public/_redirects + dist/_redirects (159 SEO 301! rules), and per-route dist/{path}/index.html SEO shells
#   Rewrites:              dist/_redirects only (do not add /* → /index.html in this file)
#
# Python API: rootDir fastapi only. Do not point the apex domain at that service.
#
# https://render.com/docs/redirects-rewrites
# https://render.com/docs/static-sites

services:
  # FastAPI (e.g. fastapi-0bcw.onrender.com) — Python app lives in fastapi/
  - type: web
    name: askpatio-ai
    runtime: python
    plan: free
    rootDir: fastapi
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true

  # Vue SPA — attach custom domain loomihomepatios.ca only to this static service.
  # (Dashboard Root Directory: leave empty or "." = repo root, same as package.json.)
  - type: web
    name: loomihome-patios
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # SEO path rewrites and SPA fallback live in dist/_redirects (generated by generate-seo-shells.js).
    # Do not add a /* → /index.html rule here — it overrides slashless SEO shell URLs.
    autoDeploy: true
